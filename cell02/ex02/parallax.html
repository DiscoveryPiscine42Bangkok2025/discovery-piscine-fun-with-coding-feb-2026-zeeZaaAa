<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax Exercise</title>
    <link rel="stylesheet" href="parallax.css">
</head>
<body>

    <div class="parallax img1">
        <div class="caption">
            <span class="border">WELCOME TO THE TOP</span>
        </div>
    </div>

    <div class="content-block">
        <h3>Section Title</h3>
        <p>This is the black block area. As you scroll, the background images stay fixed while this text moves smoothly over them. This is the core of the parallax method.</p>
    </div>

    <div class="parallax img2">
        <div class="caption">
            <span class="border">REACHED THE BOTTOM</span>
        </div>
    </div>

</body>
</html>
